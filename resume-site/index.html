<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technical Support & Systems Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">Systems &amp; Technical Operations</p>
      <h1 id="headline">Infrastructure, Support &amp; Automation</h1>
      <p id="summary" class="lead"></p>
      <div class="actions">
        <button id="filter-all" class="btn active" type="button">All Experience</button>
        <button id="filter-it" class="btn" type="button">IT &amp; Systems</button>
        <button id="filter-ops" class="btn" type="button">Operations &amp; Craft</button>
      </div>
    </div>
  </header>
  <main class="container">
    <section>
      <h2>Core Competencies</h2>
      <div id="skills-grid" class="grid"></div>
    </section>
    <section>
      <h2>Experience Timeline</h2>
      <div id="experience-list" class="stack"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
